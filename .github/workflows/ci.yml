name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: plugins/toolbar-controls

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toolbar-controls
          path: |
            plugins/toolbar-controls/dist/magalz.toolbar-controls.mjs
            plugins/toolbar-controls/dist/magalz.toolbar-controls.json

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install plugin deps
        run: pnpm install --no-frozen-lockfile
        working-directory: plugins/toolbar-controls

      - name: Build plugin
        run: pnpm build
        working-directory: plugins/toolbar-controls

      - name: Assemble Pages root (bundle + manifest + store.json)
        run: node ./scripts/assemble-pages.mjs
        working-directory: .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: deployment
        uses: actions/deploy-pages@v4
